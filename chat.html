<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>临时聊天室</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f8fafc;
      --muted: #d1d5db;
      --line: #374151;
      --accent: #22c55e;
      --accent-2: #16a34a;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.95));
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      transform: translateY(-11%);
    }

    .top {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
    }

    .meta {
      font-size: 14px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    button.badge {
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--warn);
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.ok {
      background: var(--accent);
    }

    .status-dot.err {
      background: var(--danger);
    }

    .messages {
      height: 56vh;
      min-height: 300px;
      overflow: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.15);
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      gap: 4px;
    }

    .msg-wrap.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrap.peer {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-name {
      font-size: 12px;
      color: var(--muted);
      padding: 0 4px;
      font-weight: 600;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.45;
      word-break: break-word;
      font-size: 15px;
    }

    .msg.self {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #062c14;
      font-weight: 600;
    }

    .msg.peer {
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .msg.sys {
      align-self: center;
      max-width: 95%;
      color: var(--muted);
      background: transparent;
      border: 1px dashed var(--line);
      font-size: 13px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: flex;
      gap: 10px;
      background: var(--panel);
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      color: var(--text);
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #062c14;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .app {
        transform: none;
      }

      .messages {
        height: 58vh;
      }

      .msg-wrap {
        max-width: 90%;
      }

      .composer {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="title">临时聊天室</div>
      <div class="meta">
        <span id="room-badge" class="badge">房间: -</span>
        <button id="name-badge" class="badge" type="button" title="点击修改昵称">我: -</button>
        <span id="peer-count" class="badge">在线: 1</span>
        <span class="badge"><i id="status-dot" class="status-dot"></i><span id="status-text">连接中</span></span>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <input id="input" type="text" maxlength="1000" placeholder="输入消息，回车发送" enterkeyhint="send" autocomplete="off">
      <button id="send" disabled>发送</button>
    </div>
  </div>

  <script src="vendor/mqtt.min.js"></script>
  <script>
    (function () {
      var BROKERS = [
        'wss://broker-cn.emqx.io:8084/mqtt',
        'wss://broker.emqx.io:8084/mqtt'
      ];
      var PEER_TIMEOUT_MS = 20000;
      var PING_MS = 5000;
      var DEVICE_KEY = 'webpans-chat-device-id';
      var NAME_KEY = 'webpans-chat-display-name';
      var SURNAMES = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜'.split('');
      var GIVEN = ['三', '四', '五', '宁', '安', '和', '明', '远', '浩', '然', '嘉', '轩', '晨', '宇', '文', '博', '一', '平', '诚', '瑞', '琳', '瑶', '婷', '杰', '强', '伟', '芳', '敏', '静', '丽'];

      var params = new URLSearchParams(location.search);
      var roomCode = (params.get('room') || params.get('code') || '').trim();

      if (!roomCode) {
        roomCode = prompt('请输入聊天室编码（如 abc123）:') || '';
        roomCode = roomCode.trim();
        if (!roomCode) {
          alert('未提供聊天室编码，页面将停止。');
          return;
        }
        params.set('room', roomCode);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
      }

      roomCode = roomCode.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
      if (!roomCode) {
        alert('聊天室编码无效。');
        return;
      }

      var roomBadge = document.getElementById('room-badge');
      var nameBadge = document.getElementById('name-badge');
      var peerCountEl = document.getElementById('peer-count');
      var statusDot = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var messagesEl = document.getElementById('messages');
      var inputEl = document.getElementById('input');
      var sendBtn = document.getElementById('send');

      roomBadge.textContent = '房间: ' + roomCode;

      if (typeof mqtt === 'undefined' || typeof mqtt.connect !== 'function') {
        setStatus('连接失败', 'err');
        addSys('聊天组件加载失败，请刷新页面重试。');
        return;
      }

      var selfId = nid();
      var deviceId = getDeviceId();
      var selfName = resolveSelfName();
      var topic = 'webpans/chat/' + roomCode;
      var clients = [];
      var peers = {};
      var seenIds = [];
      var seenSet = {};
      var brokerReady = false;

      renderNameBadge();

      function nid() {
        return (crypto.randomUUID && crypto.randomUUID()) ||
          (Date.now().toString(16) + Math.random().toString(16).slice(2));
      }

      function storageGet(key) {
        try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
      }

      function storageSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      }

      function getDeviceId() {
        var id = storageGet(DEVICE_KEY);
        if (id) return id;
        id = nid();
        storageSet(DEVICE_KEY, id);
        return id;
      }

      function hash32(str) {
        var h = 2166136261;
        for (var i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function hashName(id) {
        var h = hash32(String(id || ''));
        return SURNAMES[h % SURNAMES.length] + GIVEN[(h >>> 8) % GIVEN.length];
      }

      function sanitizeName(name) {
        return String(name || '')
          .replace(/[\r\n\t]/g, '')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 12);
      }

      function resolveSelfName() {
        var fromUrl = sanitizeName(params.get('name') || '');
        if (fromUrl) {
          storageSet(NAME_KEY, fromUrl);
          return fromUrl;
        }
        var saved = sanitizeName(storageGet(NAME_KEY));
        if (saved) return saved;
        return hashName(deviceId);
      }

      function renderNameBadge() {
        nameBadge.textContent = '我: ' + selfName;
      }

      function setStatus(text, kind) {
        statusText.textContent = text;
        statusDot.classList.toggle('ok', kind === 'ok');
        statusDot.classList.toggle('err', kind === 'err');
      }

      function addSys(text) {
        var div = document.createElement('div');
        div.className = 'msg sys';
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addChat(kind, name, text) {
        var wrap = document.createElement('div');
        wrap.className = 'msg-wrap ' + kind;
        var nameEl = document.createElement('div');
        nameEl.className = 'msg-name';
        nameEl.textContent = kind === 'self' ? ('我 · ' + name) : name;
        var bubble = document.createElement('div');
        bubble.className = 'msg ' + kind;
        bubble.textContent = text;
        wrap.appendChild(nameEl);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function labelFor(sid, name) {
        name = sanitizeName(name) || hashName(sid) || '游客';
        var others = [];
        if (sid !== selfId) others.push(selfName);
        Object.keys(peers).forEach(function (id) {
          if (id !== sid) others.push(peers[id].name);
        });
        if (others.indexOf(name) === -1) return name;
        return name + '·' + String(sid).replace(/-/g, '').slice(-2);
      }

      function updatePeerCount() {
        var n = 1 + Object.keys(peers).length;
        peerCountEl.textContent = '在线: ' + n;
        if (!brokerReady) {
          setStatus('连接中', '');
          sendBtn.disabled = true;
          return;
        }
        sendBtn.disabled = false;
        if (n > 1) {
          setStatus('已连接', 'ok');
        } else {
          setStatus('等待加入', '');
        }
      }

      function rememberId(id) {
        if (!id || seenSet[id]) return false;
        seenSet[id] = true;
        seenIds.push(id);
        if (seenIds.length > 400) {
          delete seenSet[seenIds.shift()];
        }
        return true;
      }

      function touchPeer(id, name) {
        if (!id || id === selfId) return;
        name = sanitizeName(name) || hashName(id);
        var prev = peers[id];
        var isNew = !prev;
        peers[id] = { seen: Date.now(), name: name };
        updatePeerCount();
        if (isNew) {
          addSys(labelFor(id, name) + ' 加入了聊天室');
          if (brokerReady) announce('ping');
        } else if (prev.name && prev.name !== name) {
          addSys(labelFor(id, prev.name) + ' 改名为 ' + labelFor(id, name));
        }
      }

      function dropPeer(id) {
        var peer = peers[id];
        if (!id || !peer) return;
        var name = labelFor(id, peer.name);
        delete peers[id];
        updatePeerCount();
        addSys(name + ' 离开了聊天室');
      }

      function prunePeers() {
        var now = Date.now();
        Object.keys(peers).forEach(function (id) {
          if (now - peers[id].seen > PEER_TIMEOUT_MS) dropPeer(id);
        });
      }

      function publishAll(payload) {
        var data = JSON.stringify(payload);
        var sent = false;
        clients.forEach(function (client) {
          if (client.connected) {
            client.publish(topic, data);
            sent = true;
          }
        });
        return sent;
      }

      function handlePayload(raw) {
        var msg;
        try {
          msg = JSON.parse(String(raw));
        } catch (e) {
          return;
        }
        if (!msg || !rememberId(msg.mid) || msg.sid === selfId) return;
        var name = sanitizeName(msg.name) || hashName(msg.sid);

        if (msg.t === 'join' || msg.t === 'ping' || msg.t === 'nick') {
          touchPeer(msg.sid, name);
          return;
        }
        if (msg.t === 'leave') {
          dropPeer(msg.sid);
          return;
        }
        if (msg.t === 'chat' && typeof msg.text === 'string' && msg.text.trim()) {
          touchPeer(msg.sid, name);
          addChat('peer', labelFor(msg.sid, name), msg.text.trim());
        }
      }

      function announce(type) {
        publishAll({ t: type, sid: selfId, mid: nid(), name: selfName });
      }

      function markBrokerReady() {
        if (brokerReady) {
          announce('ping');
          return;
        }
        brokerReady = true;
        updatePeerCount();
        announce('join');
      }

      function connectBroker(url, index) {
        var client = mqtt.connect(url, {
          clientId: 'w' + index + selfId.replace(/-/g, '').slice(0, 20),
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000,
          keepalive: 30,
          protocolVersion: 4
        });

        client.on('connect', function () {
          client.subscribe(topic, function (err) {
            if (err) {
              addSys('订阅房间失败，正在重试…');
              return;
            }
            markBrokerReady();
          });
        });

        client.on('message', function (_, payload) {
          handlePayload(payload);
        });

        client.on('offline', function () {
          var anyUp = clients.some(function (c) { return c.connected; });
          if (!anyUp) {
            brokerReady = false;
            updatePeerCount();
          }
        });

        client.on('error', function () {});

        clients.push(client);
      }

      BROKERS.forEach(connectBroker);

      setTimeout(function () {
        if (!brokerReady) {
          setStatus('连接失败', 'err');
          addSys('信令服务器连接超时。请换用系统浏览器（Safari / Chrome）打开，或检查网络后刷新。');
        }
      }, 10000);

      function sendCurrent() {
        var text = inputEl.value.trim();
        if (!text) return;
        if (!brokerReady) {
          addSys('尚未连上聊天室，请稍候再发送。');
          return;
        }
        var ok = publishAll({ t: 'chat', sid: selfId, mid: nid(), name: selfName, text: text });
        if (!ok) {
          addSys('发送失败，连接已断开。');
          return;
        }
        addChat('self', selfName, text);
        inputEl.value = '';
        inputEl.focus();
      }

      function renameSelf() {
        var next = prompt('给自己起个名字（最多 12 字）', selfName);
        if (next == null) return;
        next = sanitizeName(next);
        if (!next || next === selfName) return;
        var old = selfName;
        selfName = next;
        storageSet(NAME_KEY, selfName);
        renderNameBadge();
        addSys('我从 ' + old + ' 改名为 ' + selfName);
        if (brokerReady) announce('nick');
      }

      sendBtn.addEventListener('click', sendCurrent);
      nameBadge.addEventListener('click', renameSelf);
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendCurrent();
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && brokerReady) announce('ping');
      });

      window.addEventListener('pagehide', function () { announce('leave'); });
      window.addEventListener('beforeunload', function () { announce('leave'); });

      setInterval(function () {
        prunePeers();
        if (brokerReady) announce('ping');
      }, PING_MS);

      addSys('你是 ' + selfName + '。点右上角名字可修改。聊天记录仅保留在当前页面内存，刷新后清空。');
      updatePeerCount();
    })();
  </script>
</body>

</html>
